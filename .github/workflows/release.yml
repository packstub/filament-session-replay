name: GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)create the release for, e.g. v1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create release from CHANGELOG.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Extract the changelog section for this tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            /^## / { printing = ($0 ~ "^## " v "([^0-9]|$)") ; next }
            printing { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No \"## $version\" section in CHANGELOG.md; see the changelog for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag
